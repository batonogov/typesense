name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v2

      - name: Set up Docker
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Run API Tests
        run: task test-api
        env:
          TEST_API_KEY: ${{ secrets.TEST_API_KEY || 'API_KEY_TEST' }}
          TEST_TIMEOUT: 30

  performance-test:
    runs-on: ubuntu-latest
    needs: api-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v2

      - name: Set up Docker
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install wrk
        run: |
          sudo apt update
          sudo apt install -y wrk

      - name: Run Performance Tests
        run: task test-performance
        env:
          TEST_API_KEY: ${{ secrets.TEST_API_KEY || 'API_KEY_TEST' }}
          TEST_TIMEOUT: 30

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: test-logs
          path: |
            /tmp/typesense-test-*.log
          retention-days: 7
